name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-fund --no-audit
      - run: npm run typecheck
      - run: npm test   # worker + triage unit tests, then the script tests in scripts/test/
      - name: Shell scripts parse and lint
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done
          shellcheck --severity=warning scripts/*.sh
      - name: Workflows lint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color .github/workflows/*.yml templates/project-caller.yml
      - name: Prompt/schema files are valid
        run: for f in schemas/*.json triage/policy.config.json; do node -e 'JSON.parse(require("fs").readFileSync(process.argv[1]))' "$f"; done
